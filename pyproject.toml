[project]
name = "adk-langgraph-a2a"
version = "0.1.0"
description = "Examples combining Google ADK, LangGraph, and the A2A protocol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk",
    "google-adk>=2.14,<2.15",
    "langgraph",
    "pandas",
    "plotly",
]

[project.scripts]
sales-data = "sales_data_agent.cli:main"
sales-chart = "sales_chart_agent.cli:main"
sales-pipeline = "sales_pipeline_agent.cli:main"
adk-sales = "adk_sales_workflow.cli:main"

[dependency-groups]
dev = ["pandas-stubs", "pyright", "pytest", "ruff"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "langgraph/src/sales_data_agent",
    "langgraph/src/sales_chart_agent",
    "langgraph/src/sales_pipeline_agent",
    "adk/src/adk_sales_workflow",
]

[tool.hatch.build.targets.sdist]
include = ["langgraph/src", "adk/src", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["langgraph/tests", "adk/tests"]

[tool.pyright]
include = ["langgraph/src", "langgraph/tests", "adk/src", "adk/tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
